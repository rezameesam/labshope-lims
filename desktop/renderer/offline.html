<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabShope LIMS</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main>
    <h1>Can't connect right now</h1>
    <p id="message">LabShope LIMS couldn't reach your lab's server. Check your internet connection and try again.</p>
    <p class="error" id="reason"></p>
    <div class="row">
      <button type="button" id="change">Change workspace</button>
      <button type="button" class="primary" id="retry">Try again</button>
    </div>
  </main>
  <script src="offline.js"></script>
</body>
</html>
