name: CI

# Runs on every push and pull request. A red job tells you which part broke:
#   web       type errors, lint errors, failing unit tests, or a build that no longer compiles
#   desktop   the desktop app's own tests
#   database  a migration that no longer applies from scratch, a failing SQL test, or a
#             broken register_visit / RLS / offline-sync integration
#   promote   (main only) moves the `release` branch to the tested commit. Cloudflare Pages
#             deploys production from `release`, so nothing reaches the live lab sites unless
#             all three jobs above passed. Pushing to main alone never deploys.

on:
  push:
    branches: [main, demo, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time values only; nothing here is a secret.
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          VITE_PUBLIC_BASE_DOMAIN: example.test

  native:
    name: Native app (build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        working-directory: native
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build

  desktop:
    name: Desktop app (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: node --check main.js && node --check preload.js

      - name: Tests
        run: npm test

  database:
    name: Database (migrations, SQL tests, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install
        run: npm ci

      - name: Rebuild the database from migrations and run the database tests
        run: scripts/test-db.sh

  promote:
    name: Promote to production (release branch)
    needs: [web, desktop, native, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward release to the tested commit
        run: |
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release
            if ! git merge-base --is-ancestor origin/release HEAD; then
              echo "::error::release has commits that are not on main. Refusing to overwrite it."
              exit 1
            fi
          fi
          git push origin HEAD:refs/heads/release
          echo "release is now at $(git rev-parse --short HEAD)"
