name: Supabase Backup

on:
  workflow_dispatch:
  schedule:
    # Daily at 01:30 UTC.
    - cron: "30 1 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Missing required GitHub secret: SUPABASE_DB_URL"
            exit 1
          fi

      - name: Create logical backups (roles, schema, data)
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          backup_dir="backups/${timestamp}"
          mkdir -p "${backup_dir}"

          supabase db dump --db-url "${SUPABASE_DB_URL}" -f "${backup_dir}/roles.sql" --role-only
          supabase db dump --db-url "${SUPABASE_DB_URL}" -f "${backup_dir}/schema.sql"
          supabase db dump --db-url "${SUPABASE_DB_URL}" -f "${backup_dir}/data.sql" --data-only --use-copy

          tar -czf "backups/supabase-backup-${timestamp}.tar.gz" -C "${backup_dir}" .

          echo "timestamp=${timestamp}" >> "${GITHUB_OUTPUT}"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.dump.outputs.timestamp }}
          path: |
            backups/${{ steps.dump.outputs.timestamp }}/*.sql
            backups/supabase-backup-${{ steps.dump.outputs.timestamp }}.tar.gz
          if-no-files-found: error
          retention-days: 30
