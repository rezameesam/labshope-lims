name: Desktop Release

# Builds the LabShope LIMS desktop app for macOS, Ubuntu/Linux and Windows and
# attaches every bundle to the GitHub release that triggered the run.
#
# NOTE: this is the old Electron app. Labs now use the native app (see native-release.yml), so this no longer
# runs when a release is published; it can still be started by hand (Actions -> Desktop Release -> Run workflow).
# Run it manually to do a dry run: the bundles are built and kept as workflow artifacts, nothing is published.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: desktop

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            builder_args: --mac dmg zip --arm64 --x64
          - name: Ubuntu / Linux
            os: ubuntu-22.04
            builder_args: --linux AppImage deb --x64
          - name: Windows
            os: windows-latest
            builder_args: --win nsis --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Set app version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install desktop dependencies
        run: npm ci

      - name: Install web app dependencies
        working-directory: .
        run: npm ci

      - name: Typecheck and lint web app
        working-directory: .
        run: |
          npm run typecheck
          npm run lint

      # The installer ships its own copy of the web app so it opens instantly
      # from disk. Configure these under Settings -> Secrets and variables ->
      # Actions -> Variables (they are public client-side values).
      - name: Build bundled web app
        working-directory: .
        run: node desktop/scripts/prepare-web.js
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_PUBLIC_BASE_DOMAIN: ${{ vars.VITE_PUBLIC_BASE_DOMAIN }}
          VITE_PLATFORM_HOSTNAME: ${{ vars.VITE_PLATFORM_HOSTNAME }}
          VITE_PUBLIC_LOGO_URL: ${{ vars.VITE_PUBLIC_LOGO_URL }}
          VITE_PLATFORM_LABEL: ${{ vars.VITE_PLATFORM_LABEL }}
          VITE_PLATFORM_PRODUCT_NAME: ${{ vars.VITE_PLATFORM_PRODUCT_NAME }}
          VITE_PLATFORM_COMPANY_NAME: ${{ vars.VITE_PLATFORM_COMPANY_NAME }}
          VITE_PLATFORM_CONTACT_EMAIL: ${{ vars.VITE_PLATFORM_CONTACT_EMAIL }}
          VITE_PLATFORM_TAGLINE: ${{ vars.VITE_PLATFORM_TAGLINE }}
          VITE_RAZORPAY_KEY_ID: ${{ vars.VITE_RAZORPAY_KEY_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_PAGES_CNAME_TARGET: ${{ vars.VITE_PAGES_CNAME_TARGET }}

      - name: Unit tests
        run: npm test

      # Linux runners need a display and a SUID sandbox for Electron, so the
      # boot checks run on macOS and Windows only.
      - name: Smoke test (boots the real app)
        if: runner.os != 'Linux'
        run: |
          npm run smoke
          npm run smoke:bundled

      - name: Build bundles
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: List bundles
        run: ls -lh dist

      - name: Keep bundles as workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: lims-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Attach bundles to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          files=$(find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \))
          echo "Uploading to $TAG:"
          echo "$files"
          gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
